[package]
name = "ex_turso"
version = "0.4.1"
authors = []
edition = "2021"

[lib]
name = "ex_turso"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
turso = { version = "0.7", features = ["sync"] }
# Keep FTS enabled explicitly on the shared Turso core dependency.
turso_core = { version = "0.7", features = ["fts"] }
rustler = "0.38"
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
